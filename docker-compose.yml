# ============================================================================
# Plantão 360 — stack única (produção e homologação).
#
# Toda atualização vem dentro da imagem. Para atualizar:
#   1. edite APP_VERSION no .env
#   2. docker compose down; docker compose pull; docker compose up -d
#
# Não existe "build:" aqui de propósito: o servidor nunca compila, só baixa.
# As imagens são publicadas pelo GitHub Actions (.github/workflows/release-images.yml).
#
# A pasta do servidor precisa conter apenas: docker-compose.yml, .env e logo.png.
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: plantao360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - plantao360_pg_data:/var/lib/postgresql/data
    networks:
      - plantao360
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/brodbeck-michel/plantao360-backend:${APP_VERSION}
    container_name: plantao360_backend
    restart: unless-stopped
    # A API não é publicada no host: o nginx do serviço "frontend" faz proxy de
    # /api -> backend:8000 pela rede interna. Só a porta do frontend é pública.
    env_file:
      - .env
    environment:
      # Montada a partir das POSTGRES_* — evita a senha escrita em dois lugares.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - plantao360
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    # Imagem nginx com o SPA já compilado e o nginx.conf embutido (inclui o
    # proxy /api -> backend). Fica na mesma stack/rede do backend.
    image: ghcr.io/brodbeck-michel/plantao360-frontend:${APP_VERSION}
    container_name: plantao360_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      # Único arquivo customizável no servidor: troque o logo.png da pasta e
      # reinicie o container. rangel: bind de arquivo único, sem entrypoint de cópia.
      - ./logo.png:/usr/share/nginx/html/logo.png:ro
    networks:
      - plantao360
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  plantao360_pg_data:

networks:
  plantao360:
    driver: bridge
